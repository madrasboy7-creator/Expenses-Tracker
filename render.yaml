services:
  - type: web
    name: expenses-tracker
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NEXT_PUBLIC_SUPABASE_URL
        value: https://vybqpgteupsrdunosqar.supabase.co
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
